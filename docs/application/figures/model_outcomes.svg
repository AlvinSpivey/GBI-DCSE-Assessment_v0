<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Separate model-output results</title><desc id="desc">Historical 768 executions: 369 parse and 399 schema rejects. Added eight cases: six parse and two schema rejects.</desc><rect width="1000" height="300" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif" fill="#1f2328"><text x="30" y="35" font-size="23" font-weight="700">Two model runs: different tasks and protocols</text><text x="30" y="94" font-size="17">Historical Qwen3-4B</text><rect x="300" y="73" width="269.0625" height="32" fill="#a9b5be"/><rect x="569.0625" y="73" width="290.9375" height="32" fill="#dfe5e9"/><text x="880" y="94" font-size="16">0/768</text><text x="300" y="130" font-size="14">369 parse rejects; 399 schema rejects; zero admitted</text><text x="30" y="176" font-size="17">Added Qwen2.5-0.5B</text><rect x="300" y="155" width="420.0" height="32" fill="#e9c446"/><rect x="720.0" y="155" width="140.0" height="32" fill="#fff0a3"/><text x="880" y="176" font-size="16">0/8</text><text x="300" y="212" font-size="14">6 parse rejects; 2 schema rejects; zero admitted</text><text x="30" y="268" font-size="15">Bars show within-run rejection shares. They do not compare model capability.</text></g></svg>
