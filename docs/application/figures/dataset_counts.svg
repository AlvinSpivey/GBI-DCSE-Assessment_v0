<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Canonical dataset counts</title><desc id="desc">Four record types, 52102 total records and 310 synthetic subjects.</desc><rect width="1000" height="320" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif" fill="#1f2328"><text x="30" y="35" font-size="23" font-weight="700">Canonical records: 52,102 within 310 synthetic subjects</text><text x="30" y="97" font-size="16">Patients</text><rect x="185" y="76" width="4.79864179961551" height="28" fill="#e9c446"/><text x="200.7986417996155" y="97" font-size="16">310</text><text x="30" y="144" font-size="16">Encounters</text><rect x="185" y="123" width="169.25274011934187" height="28" fill="#e9c446"/><text x="365.25274011934187" y="144" font-size="16">10,934</text><text x="30" y="191" font-size="16">Problems</text><rect x="185" y="170" width="12.460989189324147" height="28" fill="#e9c446"/><text x="208.46098918932415" y="191" font-size="16">805</text><text x="30" y="238" font-size="16">Observations</text><rect x="185" y="217" width="620.0" height="28" fill="#e9c446"/><text x="816.0" y="238" font-size="16">40,053</text><text x="30" y="299" font-size="15">Source: selected dataset summary. Record count is not a clinical sample size.</text></g></svg>
