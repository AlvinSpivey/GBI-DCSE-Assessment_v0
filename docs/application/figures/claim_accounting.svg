<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275" viewBox="0 0 1000 275" role="img" aria-labelledby="title desc"><title id="title">DCSE claim accounting</title><desc id="desc">95 met claims, one erratum, three out of scope. These are not patient outcomes.</desc><rect width="1000" height="275" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif" fill="#1f2328"><text x="30" y="35" font-size="23" font-weight="700">Original DCSE register: 99 claims, not clinical accuracy</text><rect x="30" y="72" width="882.8282828282828" height="46" fill="#d7dee3"/><rect x="912.8282828282828" y="72" width="9.292929292929294" height="46" fill="#e9c446"/><rect x="922.1212121212121" y="72" width="27.87878787878788" height="46" fill="#b5bbc0"/><text x="30" y="160" font-size="19">95 met / 96 testable</text><text x="365" y="160" font-size="19">1 erratum retained</text><text x="665" y="160" font-size="19">3 out of scope</text><text x="30" y="210" font-size="16">Passing checks of a claim register does not make every original claim true.</text><text x="30" y="243" font-size="15">Source: selected reference-suite outcome summary. Software/synthetic scope only.</text></g></svg>
